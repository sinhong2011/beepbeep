# Engine + CLI workspace. The NSH desktop app lives in `app/` (its own Cargo project, as `nsh` expects).
[workspace]
resolver = "2"
members = ["crates/beep-core", "crates/beep-cli"]
exclude = ["app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
url = { version = "2", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
mime_guess = "2"
percent-encoding = "2"

# Hashing and HTTP are unusably slow unoptimized; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 2
